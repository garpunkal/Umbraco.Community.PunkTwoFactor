on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Run Unit Tests with Coverage
        run: dotnet test punkTwoFactor.Tests --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: TypeScript check
        working-directory: playwright
        run: npm run typecheck
      - name: ESLint
        working-directory: playwright
        run: npm run lint

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json
      - name: Install Playwright & dependencies
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Trust .NET dev certificate
        run: dotnet dev-certs https
      - name: Run Playwright Tests
        working-directory: playwright
        run: npm test
        env:
          CI: true
      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ci
          path: playwright/playwright-report/
          retention-days: 7
