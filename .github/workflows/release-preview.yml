on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-[a-z]*[0-9][0-9][0-9]"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+-[a-z]*[0-9][0-9][0-9]"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Run Unit Tests
        run: dotnet test punkTwoFactor.Tests --configuration Release --no-build

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        working-directory: playwright
        run: npm ci
      - name: TypeScript check
        working-directory: playwright
        run: npm run typecheck
      - name: ESLint
        working-directory: playwright
        run: npm run lint

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json
      - name: Install Playwright & dependencies
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Trust .NET dev certificate
        run: dotnet dev-certs https
      - name: Run Playwright Tests
        working-directory: playwright
        run: npm test
        env:
          CI: true
      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-preview
          path: playwright/playwright-report/
          retention-days: 7

  publish:
    needs: [unit-tests, lint-and-typecheck, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Pack
        run: dotnet pack punkTwoFactor/punkTwoFactor.csproj --configuration Release /p:Version=${VERSION} --output .
      - name: NuGet Login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: garpunkal
      - name: Push
        run: dotnet nuget push Umbraco.Community.PunkTwoFactor.${VERSION}.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
