name: Bug report
description: Report a bug or unexpected behavior in Umbraco.Community.PunkTwoFactor
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "e.g., Umbraco 18.2.1, Umbraco.Community.PunkTwoFactor 18.3.2.5, .NET 10"
    validations:
      required: true
